name: Verificar versoes dos assets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Catalogo do cardapio escrito no HTML em dia com os dados
        run: python tools/cardapio/prerenderizar.py --verificar
      - name: Hashes ?v= em dia com o conteudo dos assets
        run: python tools/cache/versionar_assets.py --verificar
      - name: CSP com o hash de todos os scripts de cada pagina
        run: python tools/seguranca/csp.py --verificar

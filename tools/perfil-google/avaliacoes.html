<!doctype html>
<html lang="pt-BR">
<head>

    a { color: inherit; }
    button { display: block; margin: 20px auto; padding: 12px 20px; border: 0; border-radius: 8px; color: white; background: #12293d; font: inherit; cursor: pointer; }
    @media print { body { background: white; } main { width: 95mm; margin: 10mm auto; padding: 8mm; } button { display: none; } }

</head>
